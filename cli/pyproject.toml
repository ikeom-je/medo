[project]
name = "medo-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "medo-core",
    "typer>=0.12",
    "pyyaml>=6",
]

[project.scripts]
medo = "medo_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medo_cli"]
