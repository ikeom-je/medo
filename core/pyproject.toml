[project]
name = "medo-core"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "google-cloud-firestore>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medo_core"]
