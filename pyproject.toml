[project]
name = "medo-workspace"
version = "0.1.0"
description = "Medo(目処) — クラウド非依存の上流工程Agent"
requires-python = ">=3.12"
license = "MIT"

[tool.uv.workspace]
members = ["core", "cli"]

[tool.uv.sources]
medo-core = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "cli/tests", "skills/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
