[project]
name = "medo-etl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "medo-core",
    "google-cloud-bigquery>=3.25",
    "google-cloud-billing>=1.13",
    "google-genai>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medo_etl"]
